# Configuration for piano_control.py and midi_capture.py.
# Paths use ~, which the applications expand, so nothing here depends on your
# username. Edit and then restart whichever service you changed:
#   sudo systemctl restart piano-control piano-capture

[paths]
soundfont_dir = "~/soundfonts"
state_file = "~/.local/state/piano/state.json"

[fluidsynth]
host = "127.0.0.1"
port = 9800
connect_retries = 60          # 60 x connect_delay = how long to wait at boot
connect_delay = 1.0
load_timeout = 180.0          # a 600MB soundfont off an SD card is slow
# true  = load the new font before unloading the old one (fast switch, needs
#         RAM for both at once -- fine on a 4GB Pi, risky on 2GB)
# false = unload first, then load (slower switch, half the peak RAM)
load_before_unload = true

[display]
rotation = 0                  # LED matrix rotation: 0, 90, 180, 270
joystick_rotation = 0         # set to match `rotation` if directions feel wrong
low_light = true              # dimmer, cooler, and less distracting
idle_timeout = 6.0            # seconds of no input before the display sleeps
highlight_seconds = 0.5       # how long the position blink lasts
scroll_step_seconds = 0.06    # lower = faster scrolling
show_loaded_marker = true     # dimly mark the loaded font while browsing
show_ready_animation = true   # brief sweep once the startup font is loaded

[colours]
cursor = [0, 120, 255]
loaded = [0, 70, 0]

# Scrolling text. Keep this to a SINGLE channel -- [0, n, 0], [n, 0, 0] or
# [0, 0, n]. Each pixel on the Sense HAT is one package holding three separate
# dies, so a white or mixed colour lights all three and you see three distinct
# points per pixel, which smears the edges of a 3x5 glyph and makes it hard to
# read. One channel lights one die: a single clean point. Green is the most
# legible of the three because it sits at the eye's peak sensitivity; red is a
# good alternative, blue the worst (the eye focuses it poorly).
text = [0, 140, 0]
success = [0, 150, 0]
error = [150, 0, 0]
busy = [140, 70, 0]
wifi_on = [0, 60, 160]
wifi_off = [90, 40, 0]

[wifi]
# Off by default. See the README before enabling: FluidSynth is light enough
# that this probably buys you nothing, and disabling WiFi ends your SSH
# session. WiFi is always re-enabled at startup, so a reboot recovers.
toggle_enabled = false
hold_seconds = 2.0
hold_direction = "up"

[shutdown]
# Powering off cleanly without SSH. Hold the joystick in `hold_direction` and
# the grid fills over `hold_seconds`; let go at any point and nothing happens.
# Only when the grid is completely full does it halt.
#
# Requires a narrow sudoers rule, or it will flash red and log why:
#   sudo tee /etc/sudoers.d/piano-shutdown >/dev/null <<EOF
#   $USER ALL=(root) NOPASSWD: /sbin/poweroff
#   EOF
#   sudo chmod 440 /etc/sudoers.d/piano-shutdown
enabled = true
hold_direction = "down"
hold_seconds = 5.0

[pedal]
# Where the sustain pedal engages.
#
# MIDI treats CC64 as a switch at 64, and FluidSynth follows that. Pianos with
# a half-damper pedal report an intermediate value for the partial position --
# a Yamaha P-95 sends 0 (up), 56 (partial) and 127 (down) -- and 56 falls below
# 64, so the entire partial zone reads as pedal-up. Sustain then arrives only
# when the pedal is pressed all the way down, which feels like it needs a
# deeper press than the piano's own engine wants.
#
# Set this to the value your piano reports for its partial position and sustain
# will engage there instead. Find yours with:
#   aseqdump -p "USB MIDI Interface" | grep "controller 64"
#
# Leave at 64 for standard MIDI behaviour and the router is not touched at all.
#
# Note this only moves where the switch flips. It cannot give partial damping:
# SoundFont 2 has no parameter for a half-damped string, so any value at or
# above the threshold is full sustain.
sustain_threshold = 56

[capture]
# Rolling MIDI recording. Everything you play is held in memory; nothing is
# written to disk until you hold the joystick in. See the README.
enabled = true
socket_path = "/run/piano/capture.sock"
recordings_dir = "~/recordings"

# How much playing a saved file contains. An hour of dense two-handed playing
# measures around 11MB of RAM and saves to a ~390KB .mid.
window_minutes = 60

# Hard ceiling so memory exhaustion is impossible regardless of playing
# density. Never reached in normal use; the time window is the real policy.
max_events = 250000

# Saved recordings older than this are deleted after each successful save, so
# the directory cannot quietly fill the SD card. Set to 0 to never delete.
retention_days = 30

# Substring of the ALSA MIDI input port name, as shown by `aconnect -l`.
# "Midi Through" is always skipped -- it is a virtual loopback, not your piano.
port_match = "MIDI"

# How long to hold the joystick in before a save triggers. A shorter press
# still loads the soundfont under the cursor as before.
hold_seconds = 1.5
